name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Same image as the official CTRPluginFramework BlankTemplate:
    # devkitARM + libctru + libctrpf 0.8.0 + 3gxtool.
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload .3gx
        uses: actions/upload-artifact@v4
        with:
          name: 3DSMonitor-3gx
          path: 3DSMonitor.3gx
          if-no-files-found: error

      - name: Upload .elf (debug symbols)
        uses: actions/upload-artifact@v4
        with:
          name: 3DSMonitor-elf
          path: 3DSMonitor.elf

  host-tests:
    # Framebuffer conversion + PC tools, compiled and run on the CI machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: tests/host/run.sh
